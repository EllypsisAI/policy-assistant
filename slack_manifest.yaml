display_information:
  name: Policy Assistant
  description: Answers company policy questions and names the relevant policy.
features:
  bot_user:
    display_name: Policy Assistant
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
